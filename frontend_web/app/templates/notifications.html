<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Expert Decision Replay Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        window.BACKEND_API_URL = "{{ BACKEND_API_URL }}";
    </script>
    <style>
        .notif-header-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
        }
        .notif-filters {
            display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
        }
        .notif-filters select {
            padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06); color: #e0e0e0; font-size: 0.875rem;
        }
        .notif-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .notif-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 1.25rem 1.5rem; display: flex; gap: 1rem;
            align-items: flex-start; transition: all 0.25s ease; cursor: pointer;
            position: relative;
        }
        .notif-card:hover {
            background: rgba(255,255,255,0.08); border-color: rgba(99,102,241,0.3);
            transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .notif-card.unread {
            border-left: 3px solid #6366f1;
            background: rgba(99,102,241,0.06);
        }
        .notif-icon {
            width: 44px; height: 44px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;
        }
        .notif-icon.approval_assigned { background: rgba(59,130,246,0.15); }
        .notif-icon.decision_approved { background: rgba(34,197,94,0.15); }
        .notif-icon.decision_rejected { background: rgba(239,68,68,0.15); }
        .notif-icon.comment_added { background: rgba(168,85,247,0.15); }
        .notif-icon.document_uploaded { background: rgba(245,158,11,0.15); }
        .notif-icon.status_changed { background: rgba(14,165,233,0.15); }
        .notif-body { flex: 1; min-width: 0; }
        .notif-title {
            font-weight: 600; font-size: 0.95rem; color: #f1f5f9; margin-bottom: 0.3rem;
        }
        .notif-message {
            font-size: 0.85rem; color: rgba(255,255,255,0.6); line-height: 1.5;
            overflow: hidden; text-overflow: ellipsis;
        }
        .notif-time {
            font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 0.4rem;
        }
        .notif-actions {
            display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0;
        }
        .notif-mark-btn {
            padding: 0.35rem 0.75rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06); color: #a5b4fc; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s;
        }
        .notif-mark-btn:hover { background: rgba(99,102,241,0.2); border-color: #6366f1; }
        .unread-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #6366f1;
            position: absolute; top: 1.25rem; right: 1.25rem;
        }
        .notif-empty {
            text-align: center; padding: 4rem 2rem; color: rgba(255,255,255,0.4);
        }
        .notif-empty-icon { font-size: 3rem; margin-bottom: 1rem; }
        .notif-empty p { font-size: 1rem; }
        .notif-count-badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
            padding: 0.2rem 0.6rem; border-radius: 10px; font-size: 0.75rem; font-weight: 700;
        }
        .mark-all-btn {
            padding: 0.5rem 1.2rem; border-radius: 8px; border: 1px solid rgba(99,102,241,0.3);
            background: rgba(99,102,241,0.1); color: #a5b4fc; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .mark-all-btn:hover { background: rgba(99,102,241,0.25); border-color: #6366f1; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo-icon">ED</div>
                <div class="logo-text">DecisionReplay</div>
            </div>
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="/dashboard">
                        <span>📊</span> Dashboard
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/decisions/create">
                        <span>➕</span> Record Decision
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/documents">
                        <span>📁</span> Documents
                    </a>
                </li>
                <li class="menu-item">
                    <a href="/reports">
                        <span>📈</span> Reports & Analytics
                    </a>
                </li>
                <li class="menu-item active">
                    <a href="/notifications">
                        <span>🔔</span> Notifications <span class="notif-count-badge" id="sidebar-notif-badge" style="display:none;">0</span>
                    </a>
                </li>
                <li class="menu-item" id="menu-audit-logs" style="display: none;">
                    <a href="/audit-logs">
                        <span>🛡️</span> Audit Logs
                    </a>
                </li>
            </ul>
            <div class="user-profile-section">
                <div>
                    <div class="user-info-name" id="sidebar-user-name">Loading...</div>
                    <div class="user-info-role" id="sidebar-user-role">User</div>
                </div>
                <button class="logout-btn" id="sidebar-logout-btn">
                    <span>🚪</span> Sign Out
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header-container">
                <div>
                    <h1 class="page-title">🔔 Notifications</h1>
                    <p class="page-subtitle">Stay updated on approval assignments, decision status changes, comments, and more</p>
                </div>
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                    <span class="notif-count-badge" id="header-unread-count">0 unread</span>
                    <button class="mark-all-btn" id="mark-all-read-btn" onclick="markAllRead()">✓ Mark All Read</button>
                </div>
            </div>

            <!-- Filters -->
            <div class="notif-header-row">
                <div class="notif-filters">
                    <select id="filter-type" onchange="loadNotifications()">
                        <option value="">All Types</option>
                        <option value="approval_assigned">Approval Assigned</option>
                        <option value="decision_approved">Decision Approved</option>
                        <option value="decision_rejected">Decision Rejected</option>
                        <option value="comment_added">Comment Added</option>
                        <option value="document_uploaded">Document Uploaded</option>
                        <option value="status_changed">Status Changed</option>
                    </select>
                    <select id="filter-status" onchange="loadNotifications()">
                        <option value="">All</option>
                        <option value="0">Unread</option>
                        <option value="1">Read</option>
                    </select>
                </div>
            </div>

            <!-- Notification List -->
            <div class="notif-list" id="notif-list">
                <div class="notif-empty">
                    <div class="notif-empty-icon">🔔</div>
                    <p>Loading notifications...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = window.BACKEND_API_URL;
        const token = localStorage.getItem('token');
        let currentUser = null;

        if (!token) { window.location.href = '/login'; }

        // Load user info
        async function loadUser() {
            try {
                const res = await fetch(`${API}/users/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) { window.location.href = '/login'; return; }
                currentUser = await res.json();
                document.getElementById('sidebar-user-name').textContent = currentUser.full_name;
                document.getElementById('sidebar-user-role').textContent = currentUser.role;
                // Show audit logs for admins
                if (currentUser.role === 'Administrator' || currentUser.role === 'Manager') {
                    const el = document.getElementById('menu-audit-logs');
                    if (el) el.style.display = '';
                }
            } catch (e) {
                window.location.href = '/login';
            }
        }

        function getTypeIcon(type) {
            const icons = {
                'approval_assigned': '📋',
                'decision_approved': '✅',
                'decision_rejected': '❌',
                'comment_added': '💬',
                'document_uploaded': '📄',
                'status_changed': '🔄'
            };
            return icons[type] || '🔔';
        }

        function formatTime(dateStr) {
            const d = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        async function loadNotifications() {
            const filterType = document.getElementById('filter-type').value;
            const filterStatus = document.getElementById('filter-status').value;

            let url = `${API}/notifications/?limit=100`;
            if (filterStatus !== '') url += `&is_read=${filterStatus}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) throw new Error('Failed to load');
                let notifications = await res.json();

                // Client-side filter by type
                if (filterType) {
                    notifications = notifications.filter(n => n.type === filterType);
                }

                const container = document.getElementById('notif-list');
                if (notifications.length === 0) {
                    container.innerHTML = `
                        <div class="notif-empty">
                            <div class="notif-empty-icon">🔔</div>
                            <p>No notifications${filterType || filterStatus !== '' ? ' matching filters' : ''}</p>
                        </div>`;
                    return;
                }

                container.innerHTML = notifications.map(n => `
                    <div class="notif-card ${n.is_read === 0 ? 'unread' : ''}" onclick="handleNotifClick(${n.id}, ${n.decision_id || 'null'})">
                        ${n.is_read === 0 ? '<div class="unread-dot"></div>' : ''}
                        <div class="notif-icon ${n.type}">${getTypeIcon(n.type)}</div>
                        <div class="notif-body">
                            <div class="notif-title">${escapeHtml(n.title)}</div>
                            <div class="notif-message">${escapeHtml(n.message)}</div>
                            <div class="notif-time">${formatTime(n.created_at)}</div>
                        </div>
                        <div class="notif-actions">
                            ${n.is_read === 0 ? `<button class="notif-mark-btn" onclick="event.stopPropagation(); markRead(${n.id})">Mark Read</button>` : '<span style="font-size:0.75rem;color:rgba(255,255,255,0.3)">Read</span>'}
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                document.getElementById('notif-list').innerHTML = `
                    <div class="notif-empty">
                        <div class="notif-empty-icon">⚠️</div>
                        <p>Failed to load notifications</p>
                    </div>`;
            }

            // Update unread count
            loadUnreadCount();
        }

        async function loadUnreadCount() {
            try {
                const res = await fetch(`${API}/notifications/count`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('header-unread-count').textContent = `${data.unread_count} unread`;
                const badge = document.getElementById('sidebar-notif-badge');
                if (data.unread_count > 0) {
                    badge.style.display = '';
                    badge.textContent = data.unread_count;
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) { /* ignore */ }
        }

        async function markRead(id) {
            try {
                await fetch(`${API}/notifications/${id}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch (e) { /* ignore */ }
        }

        async function markAllRead() {
            try {
                await fetch(`${API}/notifications/read-all`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadNotifications();
            } catch (e) { /* ignore */ }
        }

        function handleNotifClick(id, decisionId) {
            // Mark as read and navigate to decision if available
            fetch(`${API}/notifications/${id}/read`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}` }
            }).catch(() => {});
            if (decisionId) {
                window.location.href = `/decisions/${decisionId}`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Logout
        document.getElementById('sidebar-logout-btn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        // Init
        loadUser().then(() => loadNotifications());
    </script>
</body>
</html>
