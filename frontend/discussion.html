<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>EDRP — Discussion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --ink: #1c2430;
    --paper: #f6f4ef;
    --panel: #ffffff;
    --line: #dedad0;
    --accent: #2f5d50;
    --accent-soft: #e4ede9;
    --danger: #a4392f;
    --danger-soft: #f6e6e4;
    --muted: #6b7280;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 22px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.02em;
    font-weight: 600;
  }
  header .sub {
    color: #b9c2bd;
    font-size: 0.85rem;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .config-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .config-row label { font-size: 0.8rem; color: var(--muted); }
  .config-row input,
  .config-row button {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.9rem;
  }
  .config-row button {
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    gap: 18px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input[type="number"],
  .field input[type="text"],
  .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 0.92rem;
    background: #fff;
    min-height: 42px;
  }
  .field textarea { min-height: 100px; resize: vertical; }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.primary:hover { background: #274c42; }
  button.secondary {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  button.secondary:hover { background: var(--accent-soft); }
  .status { margin-top: 12px; font-size: 0.88rem; }
  .status-ok { color: var(--accent); }
  .status-err { color: var(--danger); }
  .comment-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
    background: #fff;
  }
  .comment-card.meeting-note {
    border-color: var(--accent);
    background: #f2f8f4;
  }
  .comment-card .meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .comment-card .meta span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .comment-card .badge {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .comment-body { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }
  .comment-actions {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .comment-actions button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .comment-actions button.delete {
    color: var(--danger);
    border-color: var(--danger-soft);
  }
  .comment-actions button:hover { background: var(--accent-soft); }
  .subcomments { margin-left: 18px; margin-top: 14px; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>EDRP Discussion</h1>
    <div class="sub">Comments, meeting notes, and decision discussion</div>
  </div>
</header>
<main>
  <div class="config-row">
    <div>
      <label>API base URL</label><br />
      <input type="text" id="apiBase" value="http://127.0.0.1:8001" />
    </div>
    <div>
      <label>Access token</label><br />
      <input type="text" id="apiToken" placeholder="Paste token from /auth/login" />
    </div>
    <div>
      <button class="primary" id="loadUserBtn">Load my profile</button>
    </div>
  </div>

  <section class="panel">
    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">
      <div class="field">
        <label for="decisionId">Decision ID</label>
        <input type="number" id="decisionId" placeholder="Enter decision ID" min="1" />
        <div class="hint">Comments require an existing decision. Enter the decision ID and press Load.</div>
      </div>
      <div class="field" style="align-self:end;">
        <button class="primary" id="loadCommentsBtn">Load Comments</button>
      </div>
    </div>
    <div id="discussionStatus" class="status"></div>
  </section>

  <section class="panel">
    <h2 style="margin-top:0;">Add a Comment</h2>
    <div class="field">
      <label for="commentText">Comment</label>
      <textarea id="commentText" placeholder="Write your comment"></textarea>
    </div>
    <div class="field">
      <label><input type="checkbox" id="meetingNoteCheck" /> Save as meeting note</label>
    </div>
    <button class="primary" id="addCommentBtn">Post Comment</button>
  </section>

  <section class="panel">
    <h2 style="margin-top:0;">Meeting Notes</h2>
    <div class="field">
      <label for="meetingSummary">Meeting Summary</label>
      <textarea id="meetingSummary" placeholder="Summary of the discussion"></textarea>
    </div>
    <div class="field">
      <label for="meetingConclusion">Conclusion</label>
      <textarea id="meetingConclusion" placeholder="Conclusion from the discussion"></textarea>
    </div>
    <div class="field">
      <label for="meetingAction">Next Action</label>
      <textarea id="meetingAction" placeholder="Next action items"></textarea>
    </div>
    <button class="secondary" id="saveNotesBtn">Save Meeting Notes</button>
    <div id="notesStatus" class="status"></div>
  </section>

  <section class="panel">
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px;">
      <h2 style="margin:0;">Comments</h2>
      <button class="secondary" id="refreshCommentsBtn">Refresh</button>
    </div>
    <div id="commentList"></div>
  </section>
</main>
<script>
const apiBaseEl = document.getElementById("apiBase");
const apiTokenEl = document.getElementById("apiToken");
const discussionStatus = document.getElementById("discussionStatus");
const notesStatus = document.getElementById("notesStatus");
const commentList = document.getElementById("commentList");
const loadUserBtn = document.getElementById("loadUserBtn");
const decisionIdEl = document.getElementById("decisionId");
const commentTextEl = document.getElementById("commentText");
const meetingNoteCheck = document.getElementById("meetingNoteCheck");
const meetingSummaryEl = document.getElementById("meetingSummary");
const meetingConclusionEl = document.getElementById("meetingConclusion");
const meetingActionEl = document.getElementById("meetingAction");

let currentUser = null;

function apiBase() { return apiBaseEl.value.replace(/\/$/, ""); }
function authHeaders() {
  const token = apiTokenEl.value.trim();
  return token ? { "Authorization": "Bearer " + token } : {};
}

function formatDate(dateString) {
  return new Date(dateString).toLocaleString();
}

function showStatus(element, message, isError = false) {
  element.textContent = message;
  element.className = isError ? "status status-err" : "status status-ok";
}

async function loadCurrentUser() {
  try {
    const res = await fetch(`${apiBase()}/auth/me`, {
      headers: { ...authHeaders(), "Content-Type": "application/json" },
    });
    if (!res.ok) throw new Error(`Unable to load profile (${res.status})`);
    currentUser = await res.json();
    showStatus(discussionStatus, `Logged in as ${currentUser.full_name}`);
  } catch (error) {
    currentUser = null;
    showStatus(discussionStatus, error.message, true);
  }
}

async function loadComments() {
  const decisionId = Number(decisionIdEl.value);
  if (!decisionId || decisionId < 1) {
    showStatus(discussionStatus, "Enter a valid decision ID before loading comments.", true);
    return;
  }
  try {
    const res = await fetch(`${apiBase()}/decisions/${decisionId}/comments`, {
      headers: authHeaders(),
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to load comments (${res.status})`);
    }
    const comments = await res.json();
    renderComments(comments);
    showStatus(discussionStatus, `Loaded ${comments.length} comment(s)`);
  } catch (error) {
    commentList.innerHTML = "";
    showStatus(discussionStatus, error.message, true);
  }
}

function buildCommentCard(comment, depth = 0) {
  const container = document.createElement("div");
  container.className = `comment-card${comment.is_meeting_note ? " meeting-note" : ""}`;
  container.style.marginLeft = `${depth * 18}px`;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `
    <span><strong>${comment.author_name}</strong></span>
    <span>${formatDate(comment.created_at)}</span>
    ${comment.is_meeting_note ? `<span class="badge">Meeting Note</span>` : ""}
  `;

  const body = document.createElement("div");
  body.className = "comment-body";
  body.textContent = comment.content;

  container.appendChild(meta);
  container.appendChild(body);

  const actions = document.createElement("div");
  actions.className = "comment-actions";

  const replyButton = document.createElement("button");
  replyButton.textContent = "Reply";
  replyButton.addEventListener("click", () => {
    const replyText = prompt("Write your reply:");
    if (!replyText || !replyText.trim()) return;
    postReply(comment.decision_id, comment.id, replyText.trim());
  });
  actions.appendChild(replyButton);

  if (currentUser && comment.author_id === currentUser.id) {
    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.addEventListener("click", () => editComment(comment));
    actions.appendChild(editButton);
  }

  const deleteButton = document.createElement("button");
  deleteButton.textContent = "Delete";
  deleteButton.className = "delete";
  deleteButton.addEventListener("click", () => deleteComment(comment.id));
  actions.appendChild(deleteButton);

  container.appendChild(actions);

  if (comment.replies && comment.replies.length) {
    const repliesContainer = document.createElement("div");
    repliesContainer.className = "subcomments";
    comment.replies.forEach(reply => repliesContainer.appendChild(buildCommentCard(reply, depth + 1)));
    container.appendChild(repliesContainer);
  }
  return container;
}

function renderComments(comments) {
  commentList.innerHTML = "";
  if (!comments.length) {
    commentList.innerHTML = `<div class="empty-state">No comments found for this decision yet.</div>`;
    return;
  }
  comments.forEach(comment => commentList.appendChild(buildCommentCard(comment)));
}

async function postComment() {
  const decisionId = Number(decisionIdEl.value);
  const content = commentTextEl.value.trim();
  if (!decisionId || decisionId < 1) {
    showStatus(discussionStatus, "Enter a valid decision ID before posting a comment.", true);
    return;
  }
  if (!content) {
    showStatus(discussionStatus, "Comment cannot be empty.", true);
    return;
  }
  try {
    const res = await fetch(`${apiBase()}/decisions/${decisionId}/comments`, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ content, is_meeting_note: meetingNoteCheck.checked }),
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to post comment (${res.status})`);
    }
    commentTextEl.value = "";
    meetingNoteCheck.checked = false;
    await loadComments();
    showStatus(discussionStatus, "Comment posted successfully.");
  } catch (error) {
    showStatus(discussionStatus, error.message, true);
  }
}

async function postReply(decisionId, parentId, replyText) {
  try {
    const res = await fetch(`${apiBase()}/decisions/${decisionId}/comments`, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ content: replyText, parent_id: parentId }),
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to post reply (${res.status})`);
    }
    await loadComments();
    showStatus(discussionStatus, "Reply posted successfully.");
  } catch (error) {
    showStatus(discussionStatus, error.message, true);
  }
}

async function editComment(comment) {
  const updated = prompt("Edit your comment:", comment.content);
  if (updated === null) return;
  const trimmed = updated.trim();
  if (!trimmed) {
    showStatus(discussionStatus, "Comment cannot be empty.", true);
    return;
  }
  try {
    const res = await fetch(`${apiBase()}/comments/${comment.id}`, {
      method: "PUT",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ content: trimmed }),
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to update comment (${res.status})`);
    }
    await loadComments();
    showStatus(discussionStatus, "Comment updated.");
  } catch (error) {
    showStatus(discussionStatus, error.message, true);
  }
}

async function deleteComment(commentId) {
  if (!confirm("Delete this comment?")) return;
  try {
    const res = await fetch(`${apiBase()}/comments/${commentId}`, {
      method: "DELETE",
      headers: authHeaders(),
    });
    if (!res.ok && res.status !== 204) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to delete comment (${res.status})`);
    }
    await loadComments();
    showStatus(discussionStatus, "Comment deleted.");
  } catch (error) {
    showStatus(discussionStatus, error.message, true);
  }
}

async function saveMeetingNotes() {
  const decisionId = Number(decisionIdEl.value);
  if (!decisionId || decisionId < 1) {
    showStatus(notesStatus, "Enter a valid decision ID before saving meeting notes.", true);
    return;
  }
  const summary = meetingSummaryEl.value.trim();
  const conclusion = meetingConclusionEl.value.trim();
  const action = meetingActionEl.value.trim();
  if (!summary && !conclusion && !action) {
    showStatus(notesStatus, "Enter at least one meeting note field before saving.", true);
    return;
  }
  const payload = [];
  if (summary) payload.push(`Summary: ${summary}`);
  if (conclusion) payload.push(`Conclusion: ${conclusion}`);
  if (action) payload.push(`Next Action: ${action}`);
  try {
    const res = await fetch(`${apiBase()}/decisions/${decisionId}/comments`, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ content: payload.join("\n\n"), is_meeting_note: true }),
    });
    if (!res.ok) {
      const error = await res.json().catch(() => ({}));
      throw new Error(error.detail || `Failed to save meeting notes (${res.status})`);
    }
    meetingSummaryEl.value = "";
    meetingConclusionEl.value = "";
    meetingActionEl.value = "";
    await loadComments();
    showStatus(notesStatus, "Meeting notes saved.");
  } catch (error) {
    showStatus(notesStatus, error.message, true);
  }
}

loadUserBtn.addEventListener("click", loadCurrentUser);
document.getElementById("loadCommentsBtn").addEventListener("click", loadComments);
document.getElementById("refreshCommentsBtn").addEventListener("click", loadComments);
document.getElementById("addCommentBtn").addEventListener("click", postComment);
document.getElementById("saveNotesBtn").addEventListener("click", saveMeetingNotes);
</script>
</body>
</html>
