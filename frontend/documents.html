<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>EDRP — Document Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --ink: #1c2430;
      --paper: #f6f4ef;
      --panel: #ffffff;
      --line: #dedad0;
      --accent: #2f5d50;
      --accent-soft: #e4ede9;
      --danger: #a4392f;
      --danger-soft: #f6e6e4;
      --muted: #6b7280;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      background: var(--ink);
      color: #fff;
      padding: 22px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    header h1 {
      font-size: 1.15rem;
      margin: 0;
      letter-spacing: 0.02em;
      font-weight: 600;
    }

    header .sub {
      color: #b9c2bd;
      font-size: 0.85rem;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .config-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .config-row label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .config-row input {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.85rem;
      min-width: 220px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      user-select: none;
    }

    .tab.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }

    .hidden {
      display: none;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input[type="number"],
    .field input[type="file"],
    .field select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fff;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button.primary:hover {
      background: #274c42;
    }

    button.primary:disabled {
      background: #9fb3ac;
      cursor: not-allowed;
    }

    #uploadStatus {
      margin-top: 14px;
      font-size: 0.88rem;
    }

    .status-ok {
      color: var(--accent);
    }

    .status-err {
      color: var(--danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .type-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
    }

    .row-actions button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-right: 6px;
    }

    .row-actions .delete-btn {
      color: var(--danger);
      border-color: var(--danger-soft);
    }

    .row-actions .delete-btn:hover {
      background: var(--danger-soft);
    }

    .row-actions .dl-btn:hover {
      background: var(--accent-soft);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 0.9rem;
    }

    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .refresh-bar button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>Expert Decision Replay Platform</h1>
    <span class="sub">Document Management</span>
  </header>

  <main>
    <div class="config-row">
      <div>
        <label>API base URL</label><br />
        <input type="text" id="apiBase" value="http://127.0.0.1:8001" />
      </div>
      <div>
        <label>Access token (Bearer)</label><br />
        <input type="text" id="apiToken"
          value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbkBlZHJwLmxvY2FsIiwiZXhwIjoxNzg1NjAxNzcxfQ.cpK_Ct9PLmyWkoj-dBosNJy0PnNQf6ANhvPIqgnJsSE" />
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="upload">Upload Document</div>
      <div class="tab" data-tab="list">Document List</div>
    </div>

    <!-- Upload Document Page -->
    <section id="uploadPanel" class="panel">
      <div class="field">
        <label for="decisionId">Select Decision *</label>
        <select id="decisionId">
          <option value="">-- Loading decisions... --</option>
        </select>
        <div class="hint" id="decisionHint">A file cannot be uploaded without selecting a valid decision.</div>
      </div>
      <div class="field">
        <label for="fileInput">Choose file *</label>
        <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.png,.jpg,.jpeg" />
        <div class="hint">Allowed types: PDF, DOCX, XLSX, PNG, JPG, JPEG.</div>

      </div>
      <button class="primary" id="uploadBtn">Upload</button>
      <div id="uploadStatus"></div>
    </section>

    <!-- Document List Page -->
    <section id="listPanel" class="panel hidden">
      <div class="refresh-bar">
        <div class="field" style="margin-bottom:0; flex: 1; max-width: 320px;">
          <select id="filterDecisionId">
            <option value="">All Decisions</option>
          </select>
        </div>
        <button id="refreshBtn">Refresh</button>
      </div>
      <div id="listContainer"></div>
    </section>
  </main>

  <script>
    const apiBaseEl = document.getElementById("apiBase");
    const apiTokenEl = document.getElementById("apiToken");

    function apiBase() { return apiBaseEl.value.replace(/\/$/, ""); }
    function authHeaders() {
      const token = apiTokenEl.value.trim();
      return token ? { "Authorization": "Bearer " + token } : {};
    }

    // Load decisions dropdowns
    async function loadDecisionsDropdown() {
      const decisionSelect = document.getElementById("decisionId");
      const filterSelect = document.getElementById("filterDecisionId");
      
      const selectedUploadId = decisionSelect.value;
      const selectedFilterId = filterSelect.value;

      try {
        const res = await fetch(`${apiBase()}/decisions`, {
          headers: { ...authHeaders() }
        });
        if (!res.ok) {
          throw new Error("Could not retrieve decisions list for dropdown.");
        }
        const decisions = await res.json();
        
        decisionSelect.innerHTML = '<option value="">-- Select a Decision --</option>';
        decisions.forEach(d => {
          decisionSelect.innerHTML += `<option value="${d.id}">#${d.id}: ${d.title} [${d.status}]</option>`;
        });
        
        filterSelect.innerHTML = '<option value="">All Decisions (No Filter)</option>';
        decisions.forEach(d => {
          filterSelect.innerHTML += `<option value="${d.id}">#${d.id}: ${d.title} [${d.status}]</option>`;
        });

        if (selectedUploadId) decisionSelect.value = selectedUploadId;
        if (selectedFilterId) filterSelect.value = selectedFilterId;
      } catch (err) {
        console.warn("Failed to load decisions dropdown:", err.message);
        document.getElementById("decisionHint").textContent = 
          `A file cannot be uploaded without selecting a valid decision. (Auto-fetch failed: ${err.message})`;
        
        decisionSelect.innerHTML = '<option value="">-- Failed to load decisions, check token --</option>';
        filterSelect.innerHTML = '<option value="">All Decisions</option>';
      }
    }

    // Trigger loading dropdown on startup and config changes
    document.addEventListener("DOMContentLoaded", loadDecisionsDropdown);
    apiBaseEl.addEventListener("change", loadDecisionsDropdown);
    apiTokenEl.addEventListener("change", loadDecisionsDropdown);

    // --- Tabs ---
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        const target = tab.dataset.tab;
        document.getElementById("uploadPanel").classList.toggle("hidden", target !== "upload");
        document.getElementById("listPanel").classList.toggle("hidden", target !== "list");
        if (target === "list") loadDocuments();
      });
    });

    // Auto-refresh document list when filter dropdown selection changes
    document.getElementById("filterDecisionId").addEventListener("change", loadDocuments);

    // --- Upload ---
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const decisionId = document.getElementById("decisionId").value;
      const fileInput = document.getElementById("fileInput");
      const statusEl = document.getElementById("uploadStatus");
      statusEl.textContent = "";
      statusEl.className = "";

      if (!decisionId) {
        statusEl.textContent = "Please select a decision (enter its ID) before uploading.";
        statusEl.className = "status-err";
        return;
      }
      if (!fileInput.files.length) {
        statusEl.textContent = "Please choose a file to upload.";
        statusEl.className = "status-err";
        return;
      }

      const formData = new FormData();
      formData.append("decision_id", decisionId);
      formData.append("file", fileInput.files[0]);

      const btn = document.getElementById("uploadBtn");
      btn.disabled = true;
      btn.textContent = "Uploading...";

      try {
        const res = await fetch(`${apiBase()}/documents/upload`, {
          method: "POST",
          headers: { ...authHeaders() }, // don't set Content-Type manually for FormData
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Upload failed");
        }
        statusEl.textContent = `Uploaded successfully: ${data.file_name} (id ${data.id})`;
        statusEl.className = "status-ok";
        fileInput.value = "";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
        statusEl.className = "status-err";
      } finally {
        btn.disabled = false;
        btn.textContent = "Upload";
      }
    });

    // --- List ---
    document.getElementById("refreshBtn").addEventListener("click", loadDocuments);

    function formatBytes(bytes) {
      if (!bytes && bytes !== 0) return "—";
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString();
    }

    async function loadDocuments() {
      const container = document.getElementById("listContainer");
      container.innerHTML = `<div class="empty-state">Loading...</div>`;

      const filterId = document.getElementById("filterDecisionId").value;
      let url = `${apiBase()}/documents`;
      if (filterId) url += `?decision_id=${encodeURIComponent(filterId)}`;

      try {
        const res = await fetch(url, { headers: { ...authHeaders() } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to load documents");

        if (!data.length) {
          container.innerHTML = `<div class="empty-state">No documents yet. Upload one from the "Upload Document" tab.</div>`;
          return;
        }

        let rows = data.map(doc => `
      <tr>
        <td>${doc.file_name}</td>
        <td><span class="type-chip">${doc.file_type || "unknown"}</span></td>
        <td>${formatBytes(doc.file_size)}</td>
        <td>${formatDate(doc.uploaded_at)}</td>
        <td class="row-actions">
          <button class="dl-btn" onclick="downloadDocument(${doc.id})">Download</button>
          <button class="delete-btn" onclick="deleteDocument(${doc.id})">Delete</button>
        </td>
      </tr>
    `).join("");

        container.innerHTML = `
      <table>
        <thead>
          <tr><th>File Name</th><th>File Type</th><th>File Size</th><th>Uploaded Date</th><th>Actions</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
      } catch (err) {
        container.innerHTML = `<div class="empty-state status-err">Error: ${err.message}</div>`;
      }
    }

    async function downloadDocument(id) {
      try {
        const res = await fetch(`${apiBase()}/documents/${id}/download`, { headers: { ...authHeaders() } });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Download failed");
        }
        const blob = await res.blob();
        const disposition = res.headers.get("Content-Disposition") || "";
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : `document-${id}`;
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("Error downloading file: " + err.message);
      }
    }

    async function deleteDocument(id) {
      if (!confirm("Delete this document? This cannot be undone.")) return;
      try {
        const res = await fetch(`${apiBase()}/documents/${id}`, {
          method: "DELETE",
          headers: { ...authHeaders() },
        });
        if (res.status !== 204) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Delete failed");
        }
        loadDocuments();
      } catch (err) {
        alert("Error deleting file: " + err.message);
      }
    }
  </script>

</body>

</html>
