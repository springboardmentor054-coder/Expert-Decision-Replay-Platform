databases:
  - name: edrp-db
    databaseName: expert_decision_replay_db
    user: edrp
    plan: free

services:
  - type: web
    name: edrp-backend
    runtime: docker
    rootDir: Rupavathi/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edrp-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://edrp-frontend.onrender.com
      # Set these in the Render dashboard if you want Google/Apple sign-in
      # working in production — leave blank to keep the "not configured"
      # fallback buttons.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false

  - type: web
    name: edrp-frontend
    runtime: static
    rootDir: Rupavathi/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://edrp-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_APPLE_SERVICES_ID
        sync: false
      - key: VITE_APPLE_REDIRECT_URI
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
